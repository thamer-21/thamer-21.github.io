<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>RealCut</title>
  <desc>A geometric gold letter R sliced by a diagonal cut, on a dark rounded badge.</desc>
  <defs>
    <clipPath id="up"><polygon points="0,0 400,0 400,16 0,395"/></clipPath>
    <clipPath id="lo"><polygon points="0,413 400,34 400,400 0,400"/></clipPath>
    <g id="r">
      <rect x="120" y="96" width="46" height="208" rx="8"/>
      <path d="M143,102 C233,98 262,132 262,153 C262,175 231,203 143,203" fill="none" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M170,198 L256,306" fill="none" stroke-width="46" stroke-linecap="round"/>
    </g>
  </defs>
  <rect x="0" y="0" width="400" height="400" rx="88" fill="#0e1621"/>
  <g fill="#edb840" stroke="#edb840" clip-path="url(#up)"><use href="#r"/></g>
  <g fill="#c68a24" stroke="#c68a24" clip-path="url(#lo)"><use href="#r"/></g>
